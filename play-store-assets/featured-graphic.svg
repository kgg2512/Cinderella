<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <!-- Main background gradient: deep charcoal to warm dark -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1816"/>
      <stop offset="55%" style="stop-color:#221F1C"/>
      <stop offset="100%" style="stop-color:#2A2520"/>
    </linearGradient>

    <!-- Gold gradient for text and elements -->
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8C6D20"/>
      <stop offset="30%" style="stop-color:#D4B86A"/>
      <stop offset="55%" style="stop-color:#F0D88A"/>
      <stop offset="80%" style="stop-color:#D4B86A"/>
      <stop offset="100%" style="stop-color:#8C6D20"/>
    </linearGradient>

    <!-- Gold vertical -->
    <linearGradient id="goldVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4B86A"/>
      <stop offset="50%" style="stop-color:#B8963E"/>
      <stop offset="100%" style="stop-color:#8C6D20"/>
    </linearGradient>

    <!-- Cream gradient for secondary text -->
    <linearGradient id="creamFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FAF9F7;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#FAF9F7;stop-opacity:0.9"/>
      <stop offset="80%" style="stop-color:#FAF9F7;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#FAF9F7;stop-opacity:0"/>
    </linearGradient>

    <!-- Radial glow behind slipper -->
    <radialGradient id="slipperGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#B8963E;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#B8963E;stop-opacity:0"/>
    </radialGradient>

    <!-- Vignette overlay -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#1A1816;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#1A1816;stop-opacity:0.45"/>
    </radialGradient>

    <!-- Bag glow -->
    <radialGradient id="bagGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#C49A26;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#C49A26;stop-opacity:0"/>
    </radialGradient>

    <!-- Soft drop shadow -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="textGlow" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="medBlur">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="shine" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#D4B86A" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1024" height="500" fill="url(#bgMain)"/>

  <!-- Ambient light patches -->
  <ellipse cx="200" cy="250" rx="300" ry="200" fill="#B8963E" opacity="0.04" filter="url(#softBlur)"/>
  <ellipse cx="780" cy="250" rx="280" ry="180" fill="#B8963E" opacity="0.06" filter="url(#softBlur)"/>
  <ellipse cx="512" cy="150" rx="250" ry="120" fill="#FAF9F7" opacity="0.025" filter="url(#softBlur)"/>

  <!-- Vignette -->
  <rect width="1024" height="500" fill="url(#vignette)"/>

  <!-- ── DECORATIVE LINES (top/bottom border lines) ── -->
  <!-- Top thin gold line -->
  <line x1="60" y1="30" x2="964" y2="30" stroke="url(#goldShimmer)" stroke-width="0.8" opacity="0.4"/>
  <!-- Bottom thin gold line -->
  <line x1="60" y1="470" x2="964" y2="470" stroke="url(#goldShimmer)" stroke-width="0.8" opacity="0.4"/>
  <!-- Corner accents TL -->
  <path d="M 60 30 L 60 60" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>
  <path d="M 60 30 L 90 30" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>
  <!-- Corner accents TR -->
  <path d="M 964 30 L 964 60" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>
  <path d="M 964 30 L 934 30" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>
  <!-- Corner accents BL -->
  <path d="M 60 470 L 60 440" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>
  <path d="M 60 470 L 90 470" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>
  <!-- Corner accents BR -->
  <path d="M 964 470 L 964 440" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>
  <path d="M 964 470 L 934 470" stroke="#B8963E" stroke-width="1.5" opacity="0.5"/>

  <!-- ── LEFT SIDE: LUXURY BAG ILLUSTRATION ── -->
  <!-- Bag glow bg -->
  <ellipse cx="220" cy="270" rx="160" ry="130" fill="url(#bagGlow)" filter="url(#medBlur)"/>

  <!-- LV Neverfull-style bag -->
  <g transform="translate(100, 130)" filter="url(#shadow3d)">
    <!-- Bag body -->
    <path d="M 30 80 L 30 220 Q 30 240 50 240 L 190 240 Q 210 240 210 220 L 210 80 Q 195 56 120 52 Q 45 56 30 80 Z"
          fill="url(#goldVert)"/>
    <!-- Bag shading - left -->
    <path d="M 30 80 L 30 220 Q 30 240 50 240 L 80 240 L 80 60 Q 52 62 30 80 Z"
          fill="#1A1816" opacity="0.25"/>
    <!-- Bag shading - right -->
    <path d="M 180 60 L 180 240 L 190 240 Q 210 240 210 220 L 210 80 Q 192 62 180 60 Z"
          fill="#1A1816" opacity="0.15"/>
    <!-- Bag highlight reflection top -->
    <path d="M 52 84 Q 80 68 120 66 Q 160 68 188 84 L 188 96 Q 160 82 120 80 Q 80 82 52 96 Z"
          fill="white" opacity="0.18"/>
    <!-- Handle left -->
    <path d="M 60 80 Q 56 28 90 24 Q 110 20 120 24" fill="none" stroke="#8C6D20" stroke-width="12" stroke-linecap="round"/>
    <path d="M 60 80 Q 56 28 90 24 Q 110 20 120 24" fill="none" stroke="#D4B86A" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- Handle right -->
    <path d="M 180 80 Q 184 28 150 24 Q 130 20 120 24" fill="none" stroke="#8C6D20" stroke-width="12" stroke-linecap="round"/>
    <path d="M 180 80 Q 184 28 150 24 Q 130 20 120 24" fill="none" stroke="#D4B86A" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
    <!-- Monogram pattern hint -->
    <text x="120" y="165" text-anchor="middle" font-family="serif" font-size="46" font-weight="bold" fill="#8C6D20" opacity="0.45">LV</text>
    <!-- Clasp/buckle center -->
    <rect x="96" y="125" width="48" height="28" rx="5" fill="#8C6D20"/>
    <rect x="100" y="129" width="40" height="20" rx="3" fill="#D4B86A"/>
    <rect x="106" y="133" width="28" height="12" rx="2" fill="#B8963E"/>
    <!-- Stitching detail sides -->
    <path d="M 34 90 L 34 234" stroke="#C49A26" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.35"/>
    <path d="M 206 90 L 206 234" stroke="#C49A26" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.35"/>
    <!-- Bottom seam -->
    <path d="M 34 236 L 206 236" stroke="#C49A26" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.35"/>
    <!-- Brand lettering on bag -->
    <text x="120" y="215" text-anchor="middle" font-family="serif" font-size="9" letter-spacing="4" fill="#8C6D20" opacity="0.6">LOUIS VUITTON</text>
  </g>

  <!-- ── CENTER: MAIN TYPOGRAPHY ── -->
  <!-- Eyebrow label -->
  <text x="512" y="152"
        font-family="'Noto Sans KR', sans-serif"
        font-size="11"
        font-weight="600"
        fill="#B8963E"
        text-anchor="middle"
        letter-spacing="6"
        opacity="0.9">P2P LUXURY RENTAL PLATFORM</text>

  <!-- Thin separator line -->
  <line x1="412" y1="166" x2="612" y2="166" stroke="#B8963E" stroke-width="0.8" opacity="0.4"/>

  <!-- Main headline — Cinderella (logo) -->
  <text x="512" y="248"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="88"
        font-weight="300"
        font-style="italic"
        fill="url(#goldShimmer)"
        text-anchor="middle"
        letter-spacing="4"
        filter="url(#shine)">Cinderella</text>

  <!-- Tagline 1 (Korean) -->
  <text x="512" y="298"
        font-family="'Noto Sans KR', sans-serif"
        font-size="22"
        font-weight="300"
        fill="#FAF9F7"
        text-anchor="middle"
        letter-spacing="2"
        opacity="0.88">럭셔리를 나의 것으로</text>

  <!-- Thin gold divider -->
  <line x1="362" y1="318" x2="662" y2="318" stroke="url(#goldShimmer)" stroke-width="0.7" opacity="0.35"/>

  <!-- Tagline 2 (sub) -->
  <text x="512" y="344"
        font-family="'Noto Sans KR', sans-serif"
        font-size="14"
        font-weight="300"
        fill="#A09589"
        text-anchor="middle"
        letter-spacing="1">요정들의 명품을 빌려 당신만의 신데렐라 순간을</text>

  <!-- Feature pills row -->
  <g transform="translate(512, 378)" text-anchor="middle">
    <!-- Pill 1 -->
    <rect x="-240" y="-16" width="140" height="32" rx="16" fill="rgba(184,150,62,0.12)" stroke="#B8963E" stroke-width="1" opacity="0.8"/>
    <text x="-170" y="5" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="600" fill="#B8963E" text-anchor="middle" letter-spacing="0.5">✓ 개인간 직거래</text>
    <!-- Pill 2 -->
    <rect x="-82" y="-16" width="164" height="32" rx="16" fill="rgba(250,249,247,0.06)" stroke="rgba(250,249,247,0.18)" stroke-width="1"/>
    <text x="0" y="5" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#FAF9F7" text-anchor="middle" opacity="0.75" letter-spacing="0.5">FairyRating 시스템</text>
    <!-- Pill 3 -->
    <rect x="100" y="-16" width="140" height="32" rx="16" fill="rgba(250,249,247,0.06)" stroke="rgba(250,249,247,0.18)" stroke-width="1"/>
    <text x="170" y="5" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="400" fill="#FAF9F7" text-anchor="middle" opacity="0.75" letter-spacing="0.5">P2P 보험 적용</text>
  </g>

  <!-- ── RIGHT SIDE: SLIPPER ILLUSTRATION ── -->
  <!-- Glow behind slipper -->
  <ellipse cx="820" cy="270" rx="150" ry="120" fill="url(#slipperGlow)" filter="url(#medBlur)"/>

  <g transform="translate(670, 130) scale(1.05)" filter="url(#shadow3d)">
    <!-- Heel -->
    <path d="M 68 195 L 60 226 Q 58 236 68 236 L 84 236 Q 90 236 90 228 L 88 200 Z"
          fill="url(#goldVert)"/>
    <path d="M 72 198 L 70 226 Q 69 232 72 233"
          stroke="#F0D88A" stroke-width="1.8" fill="none" opacity="0.45"/>

    <!-- Sole -->
    <path d="M 58 222 Q 100 238 200 230 Q 234 227 244 218 L 240 210 Q 212 222 198 224 Q 108 232 80 218 Z"
          fill="#1A1816" opacity="0.7"/>

    <!-- Main upper body -->
    <path d="M 86 200
             Q 86 152 118 126
             Q 148 104 192 104
             Q 232 104 252 132
             Q 270 160 258 190
             Q 244 216 198 224
             Q 128 234 86 200 Z"
          fill="url(#goldVert)"/>

    <!-- Glass shine overlay -->
    <path d="M 100 188
             Q 108 148 140 126
             Q 166 108 196 110
             Q 224 112 244 136
             L 238 126
             Q 218 100 184 98
             Q 144 96 118 120
             Q 96 142 98 186 Z"
          fill="white" opacity="0.2"/>

    <!-- Ankle strap -->
    <path d="M 88 188 Q 80 158 104 136 Q 118 124 140 124"
          stroke="#D4B86A" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 88 188 Q 80 158 104 136 Q 118 124 140 124"
          stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.3"/>

    <!-- Decorative bow on toe -->
    <path d="M 212 134 Q 192 114 186 128 Q 182 140 198 142 Z"
          fill="#D4B86A" opacity="0.9"/>
    <path d="M 238 134 Q 258 114 264 128 Q 268 140 252 142 Z"
          fill="#D4B86A" opacity="0.9"/>
    <ellipse cx="225" cy="137" rx="12" ry="10" fill="#B8963E"/>
    <ellipse cx="225" cy="137" rx="6" ry="5" fill="#D4B86A" opacity="0.7"/>
  </g>

  <!-- ── SPARKLES scattered right side ── -->
  <!-- 4-pointed stars -->
  <g opacity="0.7">
    <g transform="translate(720,148)">
      <line x1="0" y1="-10" x2="0" y2="10" stroke="#B8963E" stroke-width="1.5"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#B8963E" stroke-width="1.5"/>
      <line x1="-6" y1="-6" x2="6" y2="6" stroke="#D4B86A" stroke-width="0.8" opacity="0.5"/>
      <line x1="6" y1="-6" x2="-6" y2="6" stroke="#D4B86A" stroke-width="0.8" opacity="0.5"/>
    </g>
    <g transform="translate(900,180)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#B8963E" stroke-width="1.2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#B8963E" stroke-width="1.2"/>
    </g>
    <g transform="translate(940,310)">
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#D4B86A" stroke-width="1"/>
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#D4B86A" stroke-width="1"/>
    </g>
    <g transform="translate(690,380)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#B8963E" stroke-width="1"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#B8963E" stroke-width="1"/>
    </g>
    <!-- Left side sparkles -->
    <g transform="translate(96,168)">
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#B8963E" stroke-width="1.2"/>
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#B8963E" stroke-width="1.2"/>
    </g>
    <g transform="translate(70,310)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#D4B86A" stroke-width="1"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#D4B86A" stroke-width="1"/>
    </g>
  </g>

  <!-- Dot sparkles -->
  <circle cx="740" cy="162" r="3.5" fill="#D4B86A" opacity="0.55"/>
  <circle cx="760" cy="148" r="2" fill="#B8963E" opacity="0.45"/>
  <circle cx="912" cy="200" r="3" fill="#B8963E" opacity="0.5"/>
  <circle cx="926" cy="185" r="1.8" fill="#D4B86A" opacity="0.4"/>
  <circle cx="82" cy="150" r="3" fill="#D4B86A" opacity="0.45"/>
  <circle cx="956" cy="142" r="2.5" fill="#B8963E" opacity="0.35"/>

  <!-- ── BOTTOM: App store badge hint ── -->
  <!-- Thin separator -->
  <line x1="380" y1="428" x2="644" y2="428" stroke="#B8963E" stroke-width="0.6" opacity="0.25"/>

  <!-- App download badge area (subtle) -->
  <text x="512" y="456"
        font-family="'Noto Sans KR', sans-serif"
        font-size="11"
        font-weight="300"
        fill="#6B6159"
        text-anchor="middle"
        letter-spacing="3">신데렐라 · P2P 명품 렌탈</text>

</svg>
